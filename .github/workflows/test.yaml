name: Test Build and Scan

on:
  ### UNCOMMENT THIS SECTION TO AUTOBUILD ON ANY PUSH
  #push:
  #  branches:
  #    - main
  ### UNCOMMENT THIS SECTION TO BUILD ON A REGULAR SCHEDULE
  #schedule:
  #  - cron: '38 23 */14 * *'
  ### UNCOMMENT THIS SECTION TO ENABLE ON-DEMAND BUILDS
  workflow_dispatch:
    inputs:
      mode:
        description: 'On-Demand Distributed Scan'  
        
env:
  REGISTRY: ghcr.io
     
jobs:

  Build:
    runs-on: ubuntu-latest
    steps:
    
    - name: "Set IMAGE environmental variables"
      run: |
        echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}" >> $GITHUB_ENV
        
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}      
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: build local container
      uses: docker/build-push-action@v6
      with:
        tags: ${{ env.IMAGE }}
        push: true
        load: false

  Scan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
    
    - name: "Set IMAGE environmental variables"
      run: |
        echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}" >> $GITHUB_ENV
        
    - name: Checkout Code
      ### only need to do this if you want to pass the dockerfile to Anchore during scanning
      uses: actions/checkout@v4
        
    - name: Install Latest Syft and Grype Binaries
      run: |
        curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b ~/.local/bin
        curl -sSfL https://get.anchore.io/grype | sudo sh -s -- -b ~/.local/bin
        
    - name: Generate SBOM 
      run: |        
        syft -o json=sbom.json -o spdx-json=spdx.json ${IMAGE}
        
    - name: Generate Vulnerability Report
      run: |
        grype -o json sbom:./sbom.json > grype-vulnerability-report.json

    - name: Display Grype results (table format)
      if: always()
      run: |
        grype sbom:./sbom.json

    - name: Upload SBOM to Dependency Graph
      uses: advanced-security/spdx-dependency-submission-action@v0.1.1
      with:
        filePath: "spdx.json"

    ### optional
    - name: Archive SBOM
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: syft_sbom
        path: sbom.json
        retention-days: 90        

    - name: Archive vulnerability report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: grype-vulnerability-report
        path: grype-vulnerability-report.json
        retention-days: 90        
